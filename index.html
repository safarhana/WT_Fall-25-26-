<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Live Test</title>
  <script src="https://cdn.tailwindcss.com"></script>

  <style>

    .btn1{
      background:#3498db;
      color:#fff;
      padding: 10px 20px;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }

    .btn2{
      background: #2ecc71;
      color: #fff;
      padding: 10px 20px;
      border: none;
      border-radius: 20px;
    }

    .btn3{
      background: white;
      color:black;
      padding: 10px 20px;
      border: 2px solid black;
    }

    .btn4{
      background: white;
      color: black;
      padding: 10px 20px;
      border: 2px solid black;

    }

    .btn5{
      background:purple;
      color: white;
      padding: 10px 20px;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
    }

    .btn6{
      background: orange;
      color: white;
      padding: 10px 20px;
      border-radius: 50px;
    }

    .btn7{
      background: black;
      color: white;
      padding: 10px 20px;
      letter-spacing: 2px;
    }

    .btn8{
      background: teal;
      color: white;
      padding: 10px 20px;
      border: none;
      border-left: 5px solid black;
    }

    .btn9{
      background: transparent;
      color: black;
      padding: 10px 20px;
      border: 2px dashed
    }

    .btn10{
      background: linear-gradient(to right, red, yellow);
      color: black;
      padding: 10px 20px;
      border: none;
     
    }

    button{
      margin: 5px;
    }
  </style>


</head>

<body class="bg-gray-100">

  <nav class="bg-blue-600 text-white p-4">
    <div class="container mx-auto flex justify-between items-center">

      <h1 class="text-xl  font-bold">
        MY WEBSITE - nur farhana
      </h1>

      <ul class="hidden md:flex space-x-6">
        <li><a href='#' class="hover:text-gray-200">Home</a></li>
        <li><a href='#' class="hover:text-gray-200">About</a></li>
        <li><a href='#' class="hover:text-gray-200">Services</a></li>
        <li><a href='#' class="hover:text-gray-200">Contact</a></li>
         </ul>

        <button class="md:hidden bg-white text-blue-600 px-3 py-1 rounded">
          Menu
        </button>

     
    </div>
  </nav>

  <div class="p-8">
    <h2 class="text-2xl font-bold mb-4">
      buttons
    </h2>

    <button class="btn1">Button 1</button>
     <button class="btn2">Button 2</button>
      <button class="btn3">Button 3</button>
       <button class="btn4">Button 4</button>
        <button class="btn5">Button 5</button>
         <button class="btn6">Button 6</button>
          <button class="btn7">Button 7</button>
           <button class="btn8">Button 8</button>
            <button class="btn9">Button 9</button>
             <button class="btn10">Button 10</button>

  </div>

  <div class="p-8">

    <h2 class="text-2xl font-bold mb-4">
      Input fields
    </h2>

    <input type="text" placeholder="ENTER YOUR NAME KINDLY" class="block mb-4 w-full md:w-1/2 p-2 border border-gray-400 rounded"/>

    <input type="email" placeholder="ENTER THE EMAIL"
    class="block mb-4 w-full  md:w-1/2 border border-blue-400 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 "/>

    <input type="password" placeholder="ENTER THE PASSWORD PLEASE!"
    class="block mb-4 w-full  md:w-1/2 border border-pink-400 rounded-full"/>

  </div>
  
</body>
</html>
