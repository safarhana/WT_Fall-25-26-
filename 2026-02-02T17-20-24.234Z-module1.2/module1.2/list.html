<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>List</title>
  </head>
  <body>
    <a href="index.html"> back to home</a>
    <h1>List</h1>

    <div>
      <h3>Unordered List</h3>

      <ul style="list-style-type: circle">
        <li>HTML</li>
        <li>CSS</li>
        <li>Javascript</li>
      </ul>
    </div>

    <div>
      <h3>Ordered List</h3>
      <ol type="1" start="5" reversed>
        <li>Mango</li>
        <li>Banana</li>
        <li>Orange</li>

        <li>kisu na</li>
      </ol>
    </div>

    <div>
      <h3>Description List</h3>
      <dl>
        <dt>Google</dt>
        <dd>This is a search engine</dd>
        <dt>HTTP</dt>
        <dd>Protocol for web communication</dd>
      </dl>
    </div>
  </body>
</html>
