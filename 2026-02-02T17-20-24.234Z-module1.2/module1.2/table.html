<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <h1>Tables</h1>

    <table border="1">
      <caption>
        Student Marks
      </caption>
      <colgroup>
        <col style="background-color: yellow" />
        <col />
      </colgroup>
      <thead>
        <tr>
          <th>Name</th>
          <th>Marks</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td>Rahim</td>
          <td>85</td>
        </tr>
        <tr>
          <td>Kahim</td>
          <td>90</td>
        </tr>
      </tbody>
      <tfoot>
        <tr>
          <td>Avg</td>
          <td>87.5</td>
        </tr>
      </tfoot>
    </table>

    <h1>----------------</h1>

    <table border="1">
      <thead>
        <tr>
          <th colspan="2">Name</th>
          <th>Age</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td>Jill</td>
          <td>Smith</td>
          <td>23</td>
        </tr>
        <tr>
          <td>Eve</td>
          <td>Jackson</td>
          <td>22</td>
        </tr>
      </tbody>
    </table>

    <h1>------------------</h1>

    <table border="1">
      <thead>
        <tr>
          <th>Month</th>
          <th>Savings</th>
          <th>Savings for holiday!</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td>January</td>
          <td>$100</td>
          <td rowspan="2">$50</td>
        </tr>
        <tr>
          <td>February</td>
          <td>$80</td>
        </tr>
        <tr>
          <td>March</td>
          <td>$180</td>
          <td rowspan="3">$80</td>
        </tr>
        <tr>
          <td>April</td>
          <td>$180</td>
        </tr>
        <tr>
          <td>May</td>
          <td>$180</td>
        </tr>
      </tbody>
    </table>
  </body>
</html>
