    <div>
      <h2>Dialog Element</h2>

      <dialog id="myDialog">
        <p>Hello Dialog</p>

    <script>
      const dialog = document.getElementById("myDialog");

        dialog.showModal();

      function closeDialog() {
        dialog.close();
